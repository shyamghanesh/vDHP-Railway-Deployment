# Flyway Configuration for vDHP Database Migrations
# This file is used by Flyway to manage database schema changes

flyway.url=${DATABASE_URL}
flyway.schemas=public
flyway.locations=filesystem:./migrations/sql
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.connectRetries=3
flyway.connectRetriesInterval=1
